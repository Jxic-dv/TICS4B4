<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio JavaScript y DOM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2c3e50;
      transition: color 0.3s ease;
    }

    p {
      font-size: 1.1rem;
      color: #555555;
      padding: 10px;
      transition: all 0.3s ease;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .alerta-box {
      margin-top: 20px;
      padding: 12px;
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <h1 id="titulo-principal">Título del Proyecto</h1>
  <p class="texto-descripcion">Este párrafo cambiará de texto y color al hacer clic en el botón.</p>
  <button id="btn-accion">Ejecutar Acción</button>

  <div id="mensaje-alerta" class="alerta-box">
    ¡Acción completada con éxito desde JavaScript!
  </div>
  
  <script src="script.js"></script>
</body>
</html>
